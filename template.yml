jtex: v1
title: QuantEcon Lecture Theme
description: A dedicated theme for the QuantEcon course materials
version: 2.1.0
license: MIT
source: https://github.com/QuantEcon/quantecon-theme.mystmd
thumbnail: ./thumbnail.png
authors:
  - name: Steve Purves
    website: https://curvenote.com
    affiliations:
      - Curvenote
  - name: Rowan Cockett
    website: https://curvenote.com
    affiliations:
      - Curvenote
tags:
  - book
  - course
parts:
  - id: footer
    description: The site wide footer
# Site options (`site.options` in myst.yml). The CLI validates against this
# list and DROPS any key not declared here (#173), so every option the theme
# reads is declared below -- and it can only declare scalar types, so the
# structured ones (`languages`, `translators`, `git_metadata`) are strings
# holding a YAML block; app/i18n.ts `parseStructured` turns them back into
# data. Site-wide unless marked per-page; a per-page value goes under `site:`
# in the page's frontmatter and is validated against this same list.
#
# No `default:` on any option, deliberately. A declared default is written
# into every page's validated `site:` block even when the page set nothing,
# which then overrides the site-wide value. Defaults live in code.
options:
  - id: current_language
    type: string
    description: >
      BCP 47 code of this edition's language (e.g. `en`, `fa`, `zh-cn`). Sets the
      document `lang` and marks the active entry in the language switcher.
  - id: enable_rtl
    type: boolean
    description: Render the site right-to-left (`dir="rtl"`) for Arabic, Persian, Hebrew, Urdu editions.
  - id: languages
    type: string
    description: >
      YAML block listing every edition of this site as `- code`, `name`, `url`
      entries. With two or more entries the toolbar shows a language switcher and
      every page carries `hreflang` alternates; the first entry is `x-default`.
  - id: translators
    type: string
    description: >
      YAML block listing the edition's translators as `- name` (and optional
      `url`) entries, credited in the page header. A page overrides it under
      `site:` in its frontmatter; an empty value there suppresses the credit.
  - id: translators_label
    type: string
    description: >
      Label introducing the translators, in the edition's own language
      ("Translated by" when unset; an empty string hides the label).
  - id: language_switcher_label
    type: string
    description: >
      Accessible name and tooltip of the language switcher, in the edition's own
      language ("Switch language" when unset).
  # --- Meta / SEO ---
  - id: twitter
    type: string
    description: >
      Twitter/X handle for the `twitter:site` and `twitter:creator` card meta
      tags, with or without the leading `@`.
  - id: site_url
    type: string
    description: >
      The site's public URL (the Sphinx sites' `html_baseurl`), for the
      absolute `og:url` on every page. `site.domains` would be the natural
      source but does not reach the theme.
  - id: og_logo_url
    type: string
    description: >
      Absolute URL of the image for `og:image` when a page has no thumbnail
      (the book theme's `og_logo_url`).
  - id: twitter_logo_url
    type: string
    description: >
      Absolute URL of the image for `twitter:image` (the book theme's
      `twitter_logo_url`); falls back to the OpenGraph image.
  - id: favicon
    type: file
    description: >
      Site favicon, a path relative to myst.yml. Served at `/favicon.ico`
      (the QuantEcon lectures favicon when unset).
  # --- Analytics (rendered by @myst-theme/site's Analytics component) ---
  - id: analytics_google
    type: string
    description: Google Analytics measurement ID (e.g. `G-XXXXXXXXXX`).
  - id: analytics_plausible
    type: string
    description: Plausible analytics domain (e.g. `python.quantecon.org`).
  # --- Layout (per-page: a page may set either under `site:`) ---
  - id: hide_toc
    type: boolean
    description: Hide the contents drawer and its toolbar toggle.
  - id: hide_search
    type: boolean
    description: Hide the toolbar search control.
  - id: live_compute
    type: boolean
    description: >
      Whether in-page live compute (`project.thebe`) is offered on a page. Set
      `false` under `site:` in a lecture's frontmatter when it cannot run under
      the configured kernel (numba, JAX and other packages Pyodide lacks); set
      it site-wide to change the default for every page. Unset means on
      wherever `project.thebe` is configured.
  # --- Notebook launcher (see README "Launch buttons") ---
  - id: launch_repo_url
    type: string
    description: >
      Explicit notebook repository (full URL or `org/repo`); overrides
      `<github>` + `launch_repo_suffix`.
  - id: launch_repo_suffix
    type: string
    description: Suffix appended to the source repo to locate the notebook repo (`.notebooks` when unset).
  - id: launch_branch
    type: string
    description: Branch of the notebook repo to launch from (`main` when unset).
  - id: launch_notebooks_path
    type: string
    description: Sub-directory of the notebook repo where the notebooks live.
  - id: launch_source_path
    type: string
    description: Path prefix stripped from the page location (e.g. `lectures/`).
  # --- Git history (per-page override of plugins/git-metadata.mjs) ---
  - id: git_metadata
    type: string
    description: >
      YAML block with `last_modified` and a `changelog` list of `{hash,
      short_hash, author, date, message}`, set under `site:` in a page's
      frontmatter to pin the "Last changed" control by hand. Normally injected
      at build time by the git-metadata plugin instead.
build:
  # `npm ci`, not `npm install`: the release asset ships a lockfile (release.yml
  # generates it with `npm install --package-lock-only` and it is in `files`
  # below), so consumer installs are reproducible and the lockfile is never
  # mutated in place. `npm ci` fails without a lockfile, but the only
  # lockfile-less path is a source checkout, which is not a usable template
  # until `make build-theme` has run -- and that target installs its own.
  install: npm ci
  start: npm run start
files:
  - server.js
  - package.json
  - package-lock.json
  - public/**/*
  - build/**/*
