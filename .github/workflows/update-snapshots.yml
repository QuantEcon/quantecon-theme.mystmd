name: Update Visual Snapshots

# Refreshes the CI (-linux) visual baselines from a PR comment, mirroring
# quantecon-book-theme's workflow:
#
#   /update-snapshots      — re-captures ALL Chromium baselines for this runner
#                            (use when a visual change is intentional)
#   /update-new-snapshots  — only writes MISSING baselines
#                            (safe when adding new tests)
#
# The refreshed baselines are committed and pushed to the PR branch, so the
# `visual` CI job re-runs against them. Notes:
#   - Maintainers only: this job checks out and executes PR-branch code with a
#     `contents: write` token, so the trigger requires the commenter to be an
#     OWNER/MEMBER/COLLABORATOR and the command to start the comment.
#   - issue_comment workflows run the file from the DEFAULT branch; the
#     command only works once this workflow is on `main`.
#   - The push needs write access to the PR head branch, so this works for
#     same-repo branches, not forks.
#   - Local macOS baselines (…-darwin) are unaffected — refresh those locally
#     with `npm run test:visual:update` (see tests/visual/README.md).
on:
  issue_comment:
    types: [created]

jobs:
  update-snapshots:
    if: |
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/update-snapshots') ||
       startsWith(github.event.comment.body, '/update-new-snapshots'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: React to the comment (ack)
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR branch
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.ref);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install mystmd CLI
        run: npm install -g mystmd
      - name: Build theme template
        run: make build-theme
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update snapshots
        run: |
          MODE=all
          case "$COMMENT_BODY" in
            '/update-new-snapshots'*) MODE=missing ;;
          esac
          echo "Updating snapshots with --update-snapshots=$MODE"
          EXIT=0
          npx playwright test --project=desktop-chrome --project=mobile-chrome \
            --update-snapshots="$MODE" || EXIT=$?
          if [ "$EXIT" -ne 0 ]; then
            # In `missing` mode the run that WRITES a new baseline exits
            # non-zero by design — tolerate that one case. Any other failure
            # (fixture server down, browser install, real test crash) fails
            # the job rather than silently reporting "no snapshot changes".
            if [ "$MODE" = "missing" ] && [ -n "$(git status --porcelain tests/visual/__snapshots__)" ]; then
              echo "Non-zero exit tolerated: new baselines were written."
            else
              echo "::error::Playwright failed without updating snapshots (exit $EXIT) — see the log above."
              exit "$EXIT"
            fi
          fi
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          THEME_TEMPLATE: ${{ github.workspace }}/.deploy/quantecon-theme
          PORT: "3111"

      - name: Commit and push refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__
          if git diff --cached --quiet; then
            gh pr comment "${{ github.event.issue.number }}" \
              --body "🎭 The snapshot update produced no baseline changes."
          else
            CHANGED=$(git diff --cached --name-only | sed 's/^/- /')
            git commit -m "test: refresh CI visual snapshots (linux baselines)"
            git push
            gh pr comment "${{ github.event.issue.number }}" \
              --body "$(printf '🎭 Refreshed visual baselines in %s:\n%s' "$(git rev-parse --short HEAD)" "$CHANGED")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure on the PR
        if: failure()
        run: |
          gh pr comment "${{ github.event.issue.number }}" \
            --body "🎭 Snapshot update **failed** — see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
