# PR preview on GitHub Pages — self-contained (GITHUB_TOKEN only, no org secrets).
#
# Builds a real lecture site (QuantEcon/lecture-python-programming) with the
# PR's theme via a static `myst build --html` — the production export path,
# here run on real lecture content rather than the Playwright fixture — and
# deploys it to the gh-pages branch under pr-preview/pr-<n>/. A sticky PR
# comment links the preview; closing the PR tears the subdirectory down.
#
# The content repo is a legacy Jupyter Book (_config.yml/_toc.yml): `myst init`
# performs the JB→MyST upgrade at build time, so every preview also exercises
# that upgrade on real lecture content. Content is cloned at full depth so the
# git-metadata plugin (plugins/git-metadata.mjs) renders real per-page history.
#
# The same run builds the book theme (themes/book) on a real book, Economic
# Networks (QuantEcon/book-networks.mystmd), and stages it at book/ inside the
# lecture site, so one deploy publishes both under pr-preview/pr-<n>/ and the
# teardown removes both. The book is built with the renderer its edition
# deploys with, the QuantEcon mystmd fork, for book-mode numbering and the
# (i)/(a) list parser.
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write # push the rendered site to the gh-pages branch
  pull-requests: write # sticky preview-link comment

env:
  CONTENT_REPO: QuantEcon/lecture-python-programming
  CONTENT_DIR: lectures
  BOOK_REPO: QuantEcon/book-networks.mystmd
  # The fork tag the book's own deploy.yml builds with; move the two together.
  MYSTMD_FORK_REF: qe-v14

jobs:
  preview:
    name: Build & deploy preview (gh-pages)
    # Same-repo PRs only, like update-snapshots.yml (fork PRs get a read-only
    # GITHUB_TOKEN and could not deploy anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
      - name: Install mystmd CLI
        if: github.event.action != 'closed'
        run: npm install -g mystmd
      # Builds the candidate theme from this branch into .deploy/quantecon-theme.
      - name: Build theme template
        if: github.event.action != 'closed'
        run: make build-theme
      - name: Checkout lecture content (full history for git metadata)
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CONTENT_REPO }}
          path: preview-content
          fetch-depth: 0
      - name: Convert content to MyST and point it at the PR theme
        if: github.event.action != 'closed'
        working-directory: preview-content/${{ env.CONTENT_DIR }}
        env:
          THEME_DIR: ${{ github.workspace }}/.deploy/quantecon-theme
          PLUGIN: ${{ github.workspace }}/plugins/git-metadata.mjs
          CONTENT_GITHUB: https://github.com/${{ env.CONTENT_REPO }}
        run: |
          # `myst init` upgrades the legacy Jupyter Book to myst.yml. With
          # piped (non-TTY) stdin it exits non-zero on its follow-up
          # "run myst start now?" prompt after the config is written —
          # tolerate that, then assert the upgrade actually happened.
          printf 'y\nn\n' | myst init || true
          test -f myst.yml
          yq -i '.site.template = env(THEME_DIR)' myst.yml
          yq -i '.project.github = env(CONTENT_GITHUB)' myst.yml
          # Guarded so the preview still builds on a branch without the plugin.
          if [ -f "$PLUGIN" ]; then
            yq -i '.project.plugins = [env(PLUGIN)]' myst.yml
          fi
      # The lecture sources still carry Sphinx `{raw}` blocks, whose source
      # mystmd shows to the reader as escaped text under the page title. They
      # are rewritten out of the sources at cutover, so the preview runs the
      # same script and shows post-cutover content. It exits non-zero on a
      # block it does not recognise, which fails the preview rather than
      # publishing a page with literal markup on it.
      - name: Rewrite `{raw}` blocks out of the lecture sources
        if: github.event.action != 'closed'
        working-directory: preview-content/${{ env.CONTENT_DIR }}
        run: node ${{ github.workspace }}/scripts/rewrite-raw-blocks.mjs .

      - name: Build static site
        if: github.event.action != 'closed'
        working-directory: preview-content/${{ env.CONTENT_DIR }}
        env:
          # Must match the Pages subpath the deploy step publishes to.
          BASE_URL: /quantecon-theme.mystmd/pr-preview/pr-${{ github.event.number }}
        run: myst build --html

      # The book theme's preview. The fork has no npm package, so it is built
      # from its tag (about a minute) and run from its own folder, which leaves
      # the released `myst` above in place for the lecture build.
      - uses: oven-sh/setup-bun@v2
        if: github.event.action != 'closed'
      - name: Build the mystmd fork
        if: github.event.action != 'closed'
        run: |
          git clone --depth 1 --branch "$MYSTMD_FORK_REF" \
            https://github.com/QuantEcon/mystmd.git "$RUNNER_TEMP/qe-mystmd"
          cd "$RUNNER_TEMP/qe-mystmd"
          bun install
          bun run build
          node packages/mystmd/dist/myst.cjs --version
      # Builds the candidate book theme into .deploy/quantecon-theme-book.
      - name: Build book theme template
        if: github.event.action != 'closed'
        run: make build-book
      - name: Checkout book content
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BOOK_REPO }}
          path: preview-book
      - name: Point the book at the PR's book theme
        if: github.event.action != 'closed'
        working-directory: preview-book
        env:
          THEME_DIR: ${{ github.workspace }}/.deploy/quantecon-theme-book
          # The hero image of the book's public site, networks.quantecon.org
          # (QuantEcon/book-networks-public), drawn on the cover page's book.
          COVER_URL: https://raw.githubusercontent.com/QuantEcon/book-networks-public/main/website/images/network3.jpg
        run: |
          yq -i '.site.template = env(THEME_DIR)' myst.yml
          # The theme replaces the edition's fancy-lists plugin and stylesheet.
          yq -i 'del(.project.plugins) | del(.site.options.style)' myst.yml
          # The edition has no contents page yet (the converter is to emit
          # one), so the preview adds the theme's own, as the first page of
          # the front matter, to show that page type too.
          if [ ! -f contents.md ]; then
            printf -- '---\ntitle: Contents\n---\n' > contents.md
            yq -i '(.project.toc[] | select(.section == "frontmatter") | .children) |= [{"file": "contents.md"}] + .' myst.yml
            grep -q 'contents.md' myst.yml
          fi
          # The cover art is the project thumbnail, which mystmd copies as it
          # is. The image is 6000 px square (2 MB), so it is scaled to 1200 px
          # first. It is cosmetic: if it cannot be fetched, the preview warns
          # and builds without it.
          add_cover() {
            curl -fsSL --retry 3 "$COVER_URL" -o "$RUNNER_TEMP/cover-full.jpg" &&
              python3 -m venv "$RUNNER_TEMP/pillow" &&
              "$RUNNER_TEMP/pillow/bin/pip" install --quiet --disable-pip-version-check pillow &&
              "$RUNNER_TEMP/pillow/bin/python" -c 'import sys; from PIL import Image; im = Image.open(sys.argv[1]); im.thumbnail((1200, 1200)); im.save(sys.argv[2], quality=85)' "$RUNNER_TEMP/cover-full.jpg" cover.jpg &&
              yq -i '.project.thumbnail = "cover.jpg"' myst.yml
          }
          if ! yq -e '.project.thumbnail' myst.yml > /dev/null 2>&1; then
            add_cover || echo "::warning::Could not add the cover art from $COVER_URL; the preview's cover shows the drawn book only."
          fi
      - name: Build book site
        if: github.event.action != 'closed'
        working-directory: preview-book
        env:
          # Must match where the next step stages it under the lecture site.
          BASE_URL: /quantecon-theme.mystmd/pr-preview/pr-${{ github.event.number }}/book
        run: node "$RUNNER_TEMP/qe-mystmd/packages/mystmd/dist/myst.cjs" build --html
      - name: Stage the book inside the lecture site
        if: github.event.action != 'closed'
        run: cp -R preview-book/_build/html "preview-content/${CONTENT_DIR}/_build/html/book"

      # Deploy on opened/reopened/synchronize, tear down on closed, and keep one
      # sticky comment. These are the two actions rossjrw/pr-preview-action@v1
      # wrapped, called directly at their Node 24 majors (its own pins are still
      # Node 20). The comment keeps the `pr-preview` header, so it updates the
      # one that action left on open pull requests. Root .nojekyll on gh-pages
      # (seeded once) keeps Pages from eating the underscore-prefixed asset
      # paths (build/_assets/...).
      - name: Deploy preview
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: preview-content/${{ env.CONTENT_DIR }}/_build/html
          target-folder: pr-preview/pr-${{ github.event.number }}
          commit-message: Deploy preview for PR ${{ github.event.number }} 🛫
          force: false
          # Replace the folder's contents, so files a later build drops go too.
          clean: true
      - name: Comment with the preview link
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            :rocket: **PR preview:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
            :books: **Book theme preview** (*Economic Networks*): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/book/

            Built from ${{ github.event.pull_request.head.sha }} to the [`gh-pages`](${{ github.server_url }}/${{ github.repository }}/tree/gh-pages) branch. It is live once the [GitHub Pages deployment](${{ github.server_url }}/${{ github.repository }}/deployments) completes.
      # Deploying an empty directory over the preview's folder removes it.
      - name: Make an empty directory for the teardown
        if: github.event.action == 'closed'
        run: mkdir -p "$RUNNER_TEMP/empty"
      - name: Remove preview
        if: github.event.action == 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ runner.temp }}/empty
          target-folder: pr-preview/pr-${{ github.event.number }}
          commit-message: Remove preview for PR ${{ github.event.number }} 🛬
          force: false
          # The teardown depends on this: deploying an empty folder with clean
          # on is what deletes the preview.
          clean: true
      - name: Comment that the preview was removed
        if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: Preview removed because the pull request was closed.
