# Dependabot version updates, modelled on QuantEcon/quantecon-book-theme's
# config and QuantEcon/actions' grouped form. GitHub Actions pins are checked
# weekly and npm dependencies monthly, each split the same way: minor and
# patch updates in one grouped PR, majors in another. A major (Remix, React,
# Tailwind, TypeScript) is a migration, not a routine bump, so keeping majors
# out of the minor/patch group keeps that PR mergeable.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-dependencies-major:
        patterns:
          - "*"
        update-types:
          - major
