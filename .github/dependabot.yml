# Dependabot version updates, modelled on QuantEcon/quantecon-book-theme's
# config and QuantEcon/actions' grouped form. GitHub Actions pins are checked
# weekly and npm dependencies monthly, each split the same way: minor and
# patch updates in one grouped PR, majors in another. A major (Remix, React,
# Tailwind, TypeScript) is a migration, not a routine bump, so keeping majors
# out of the minor/patch group keeps that PR mergeable.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-dependencies-major:
        patterns:
          - "*"
        update-types:
          - major
    # Hold katex on 0.16.x. KaTeX 0.18 prefixes its CSS classes (.sizing ->
    # .katex-sizing, likewise .base, .strut, .tag, .root, ...). The maths HTML
    # on a lecture page is not rendered by this package: the mystmd CLI renders
    # it at build time with the KaTeX it bundles (0.15.6 as of mystmd 1.13.0),
    # and the theme only serves katex.min.css (themes/lecture/app/links.ts).
    # With 0.18+ CSS that HTML loses its script sizes, equation-tag placement
    # and root indices, and the visual regression suite fails on every page
    # with maths.
    # 0.17.0 is held back too: it keeps the old class names but brings no fix
    # we need. Lift this once mystmd bundles KaTeX 0.18 or later (#118).
    ignore:
      - dependency-name: katex
        versions:
          - ">=0.17.0"
      # Majors that are migrations rather than bumps, so Dependabot cannot
      # land them. @myst-theme/* and myst-to-react 2.x replace Remix with
      # React Router 8 and Vite, and move together with @remix-run/* (which
      # that work removes) and React 19; #28 tracks it. Tailwind 4 moves its
      # CLI to @tailwindcss/cli and its config into CSS (#281), and
      # TypeScript 7 removes the moduleResolution and baseUrl settings
      # tsconfig.json uses (#280), so each needs its own change. Minor and
      # patch updates still arrive in the npm-dependencies group. Drop an
      # entry once its migration lands.
      - dependency-name: "@myst-theme/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: myst-to-react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@remix-run/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
