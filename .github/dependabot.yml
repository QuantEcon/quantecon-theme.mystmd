# Dependabot version updates, modelled on QuantEcon/quantecon-book-theme's
# config and QuantEcon/actions' grouped form. GitHub Actions pins are checked
# weekly and npm dependencies monthly, each split the same way: minor and
# patch updates in one grouped PR, majors in another. A major (Remix, React,
# Tailwind, TypeScript) is a migration, not a routine bump, so keeping majors
# out of the minor/patch group keeps that PR mergeable.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: ⬆️
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-dependencies-major:
        patterns:
          - "*"
        update-types:
          - major
    # Hold katex on 0.16.x. KaTeX 0.18 prefixes its CSS classes (.sizing ->
    # .katex-sizing, likewise .base, .strut, .tag, .root, ...). The maths HTML
    # on a lecture page is not rendered by this package: the mystmd CLI renders
    # it at build time with the KaTeX it bundles (0.15.6 as of mystmd 1.13.0),
    # and the theme only serves katex.min.css (themes/lecture/app/links.ts).
    # With 0.18+ CSS that HTML loses its script sizes, equation-tag placement
    # and root indices, and the visual regression suite fails on every page
    # with maths.
    # 0.17.0 is held back too: it keeps the old class names but brings no fix
    # we need. Lift this once mystmd bundles KaTeX 0.18 or later.
    ignore:
      - dependency-name: katex
        versions:
          - ">=0.17.0"
